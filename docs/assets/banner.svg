<style>
text{font-family:Georgia,'Times New Roman',serif}
.tw{fill:#f3cf7d;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.logo{color:#f3cf7d}

.arch{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.2s cubic-bezier(.22,1,.36,1) both}
.arch2{animation-delay:.5s}
.body{animation:fade 1s ease 1.1s both}
.dome{transform-box:fill-box;transform-origin:center bottom;animation:breathe 5s ease-in-out 2.4s infinite}
.star{transform-box:fill-box;transform-origin:center;animation:fade .6s ease 1.6s both,twinkle 3.4s ease-in-out 2.4s infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.9) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}

.title{animation:rise 1s cubic-bezier(.22,1,.36,1) .5s both}
.tag{animation:rise 1s cubic-bezier(.22,1,.36,1) .8s both}
.sub{animation:rise 1s cubic-bezier(.22,1,.36,1) 1.1s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sweep{animation:sweep 4.5s ease-in-out 1.6s infinite}
@keyframes sweep{from{transform:translateX(-560px)}to{transform:translateX(560px)}}
.moon{animation:float 8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
