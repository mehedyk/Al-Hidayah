<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Al-Hidayah: Quran, Hadith, Reminder">
<title>Al-Hidayah — Qur’an · Hadith · Reminder</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041712"/><stop offset=".55" stop-color="#08241d"/><stop offset="1" stop-color="#123b30"/></linearGradient>
<radialGradient id="glow" cx=".82" cy=".25" r=".6"><stop offset="0" stop-color="#e2b857" stop-opacity=".28"/><stop offset="1" stop-color="#e2b857" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3cf7d" stop-opacity="0"/><stop offset=".5" stop-color="#fff3c4"/><stop offset="1" stop-color="#f3cf7d" stop-opacity="0"/></linearGradient>
<clipPath id="line"><rect x="372" y="262" width="540" height="3"/></clipPath>
