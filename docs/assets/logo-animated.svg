<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none" role="img" aria-label="Al-Hidayah logo">
<title>Al-Hidayah</title>
<style>svg{color:#f3cf7d}
.arch{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.2s cubic-bezier(.22,1,.36,1) both}
.arch2{animation-delay:.5s}
.body{animation:fade 1s ease 1.1s both}
.dome{transform-box:fill-box;transform-origin:center bottom;animation:breathe 5s ease-in-out 2.4s infinite}
.star{transform-box:fill-box;transform-origin:center;animation:fade .6s ease 1.6s both,twinkle 3.4s ease-in-out 2.4s infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.9) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path class="arch" pathLength="1" d="M8 56V29C8 17 19 12 32 3c13 9 24 14 24 26v27H8Z" stroke="currentColor" stroke-width="2"/>
<path class="arch arch2" pathLength="1" d="M15 56V31c0-9 7-13 17-20 10 7 17 11 17 20v25" stroke="currentColor" stroke-width="1" opacity=".65"/>
<g class="body"><path class="dome" d="M19 50h26M22 50V39h20v11M26 39v-5m12 5v-5M32 21c5 5 7 8 7 12H25c0-4 2-7 7-12Z" fill="currentColor"/>
<path d="M15 32h3v18h-3zm31 0h3v18h-3zM13 29h5v3h-5zm33 0h5v3h-5z" fill="currentColor"/></g>
<path class="star" d="m32 12.2.9 2.3 2.4.2-1.9 1.6.6 2.4-2-1.4-2 1.4.6-2.4-1.9-1.6 2.4-.2Z" fill="currentColor"/>
</svg>
